apiVersion: v1
kind: Pod
metadata:
  name: test-reference-pod
  labels:
    app: test-reference-pod
    predictive-scheduler.io/enabled: "true"
spec:
  schedulerName: scheduler-plugins-scheduler
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.9
    resources:
      requests:
        cpu: "1"
        memory: 512Mi
